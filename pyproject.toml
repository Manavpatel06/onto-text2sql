[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontosql"
version = "0.1.0"
description = "Ontology-grounded, uncertainty-aware Text-to-SQL with clarification and self-verification"
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "sqlglot>=25.0", "rdflib>=7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ontosql = "ontosql.cli:main"

[tool.setuptools.packages.find]
where = ["code"]
include = ["ontosql*"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
